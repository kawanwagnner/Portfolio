<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Metas padrão (home). O build reescreve título, descrição, canonical e
      Open Graph em cada rota (plugin seoPages no vite.config.ts), porque quem
      gera prévia de link (WhatsApp, Instagram, LinkedIn) não roda JavaScript.
      Fonte única dos textos: src/lib/seo-pages.ts.
    -->
    <title>VYSO | Sites, lojas virtuais e sistemas sob medida</title>
    <meta name="description" content="A VYSO cria sites, lojas virtuais, apps e sistemas sob medida para pequenos e médios negócios. Você fala direto com quem constrói, sem agência e sem intermediário. Projetos reais, do problema ao resultado." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Kawan Wagnner" />
    <meta name="theme-color" content="#f9f9fc" />
    <!-- Tema antes do primeiro paint (mesma regra de src/lib/theme.ts): claro por padrão -->
    <script>
      try {
        if (localStorage.getItem('vyso:theme') !== 'dark') document.documentElement.classList.add('theme-light')
      } catch (e) {
        document.documentElement.classList.add('theme-light')
      }
    </script>
    <link rel="canonical" href="https://vyso.store/" />

    <!-- Open Graph / prévia de link -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VYSO" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://vyso.store/" />
    <meta property="og:title" content="VYSO | Sites, lojas virtuais e sistemas sob medida" />
    <meta property="og:description" content="A VYSO cria sites, lojas virtuais, apps e sistemas sob medida para pequenos e médios negócios. Você fala direto com quem constrói, sem agência e sem intermediário. Projetos reais, do problema ao resultado." />
    <meta property="og:image" content="https://vyso.store/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VYSO: sites, lojas virtuais e sistemas sob medida" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VYSO | Sites, lojas virtuais e sistemas sob medida" />
    <meta name="twitter:description" content="A VYSO cria sites, lojas virtuais, apps e sistemas sob medida para pequenos e médios negócios. Você fala direto com quem constrói, sem agência e sem intermediário. Projetos reais, do problema ao resultado." />
    <meta name="twitter:image" content="https://vyso.store/og-image.jpg" />

    <!-- Quem é a VYSO, pro Google montar o painel da marca -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://vyso.store/#org",
            "name": "VYSO",
            "url": "https://vyso.store/",
            "logo": "https://vyso.store/logo.svg",
            "image": "https://vyso.store/og-image.jpg",
            "description": "Sites, lojas virtuais, apps e sistemas sob medida para pequenos e médios negócios.",
            "telephone": "+55 11 98922-0824",
            "areaServed": "BR",
            "address": { "@type": "PostalAddress", "addressLocality": "São Paulo", "addressRegion": "SP", "addressCountry": "BR" },
            "founder": { "@id": "https://vyso.store/#kawan" },
            "sameAs": ["https://www.instagram.com/vyso.store/", "https://github.com/kawanwagnner"]
          },
          {
            "@type": "Person",
            "@id": "https://vyso.store/#kawan",
            "name": "Kawan Wagnner",
            "jobTitle": "Founder & Software Engineer",
            "worksFor": { "@id": "https://vyso.store/#org" },
            "url": "https://vyso.store/#founder"
          },
          {
            "@type": "WebSite",
            "@id": "https://vyso.store/#site",
            "url": "https://vyso.store/",
            "name": "VYSO",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "https://vyso.store/#org" }
          }
        ]
      }
    </script>

    <!-- Fonte oficial da marca: Satoshi (Fontshare) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
      rel="stylesheet"
    />

    <!-- Mesmo favicon da loja vyso.com.br: o V preto, que vira branco em aba escura -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
